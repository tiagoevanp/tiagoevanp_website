name: update-website
run-name: ${{ github.actor }} is performing update on website
on:
  push:
    branches:
      - 'main'
jobs:
  update-website-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Clone tiagoevanp_website and build
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
      - name: Install pnpm packages, lint and build
        run: |
          cd source-repo
          pnpm i
          pnpm run lint
          pnpm run build

      - name: Clone tiagoevanp.github.io project
        uses: actions/checkout@v4
        with:
          repository: 'tiagoevanp/tiagoevanp.github.io'
          path: target-repo

      - name: Configure user.name and user.email
        run: |
          cd target-repo
          git config user.name "Tiago Evangelista Pinto"
          git config user.email "tiagoevanp@hotmail.com"

      - name: Sync tiagoevanp_website/out to tiagoevanp.github.io project
        # --delete removes pages that no longer exist in the build;
        # .git, CNAME and .nojekyll are not part of out/, so keep them in the target
        run:
          rsync -a --delete --exclude .git --exclude CNAME --exclude .nojekyll source-repo/out/ target-repo/

      - name: Commit changes and push into main
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          cd target-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "update-${{ github.run_id }}"
          git config --unset-all http.https://github.com/.extraheader
          git push --set-upstream https://user:$GH_TOKEN@github.com/tiagoevanp/tiagoevanp.github.io master
